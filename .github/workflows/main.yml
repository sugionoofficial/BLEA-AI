name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Preview smoke test
        run: |
          npm run preview -- --port 4173 &
          sleep 3
          curl -fsS http://localhost:4173/ -o /dev/null
          echo "Preview OK"

      - name: Configure GitHub OAuth secret
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BLEA_GITHUB_CLIENT_SECRET: ${{ secrets.BLEA_GITHUB_CLIENT_SECRET }}
        run: |
          if [ -z "$BLEA_GITHUB_CLIENT_SECRET" ]; then
            echo "::warning::GITHUB_CLIENT_SECRET tidak diatur — OAuth GitHub dinonaktifkan. Buat OAuth App di https://github.com/settings/developers dan tambahkan client secret sebagai repo secret."
            exit 0
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets not set — skipping secret put."
            exit 0
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/blea-ai/secrets" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"GITHUB_CLIENT_SECRET\",\"type\":\"secret_text\",\"value\":\"$BLEA_GITHUB_CLIENT_SECRET\"}"
          echo "GITHUB_CLIENT_SECRET configured."

      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets not set — skipping deploy. Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions."
            exit 0
          fi
          npx wrangler deploy
