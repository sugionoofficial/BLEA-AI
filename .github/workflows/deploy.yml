name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      CLOUDFLARE_API_TOKEN:
        description: 'Cloudflare API Token (Workers Admin scope)'
        required: true
        type: string
      CLOUDFLARE_ACCOUNT_ID:
        description: 'Cloudflare Account ID'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Mask credentials in logs
        run: |
          echo "::add-mask::$(jq -r '.inputs.CLOUDFLARE_API_TOKEN' "$GITHUB_EVENT_PATH")"
          echo "::add-mask::$(jq -r '.inputs.CLOUDFLARE_ACCOUNT_ID' "$GITHUB_EVENT_PATH")"

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ inputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
